# Development tooling: run Maven and npm inside containers so nothing needs to be
# installed on the host. Use scripts/mvn and scripts/npm instead of calling this directly.
#
# A separate project name keeps these containers and volumes apart from docker-compose.yml.
name: eventfund-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eventfund}
      POSTGRES_USER: ${DB_USER:-eventfund}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-dev:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ./backend:/app
      - m2:/root/.m2
    environment:
      # Tests connect to the postgres service above (no Testcontainers).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eventfund}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-eventfund}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
    depends_on:
      postgres:
        condition: service_healthy

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  pgdata:
  m2:
  node_modules:
