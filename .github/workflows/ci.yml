name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest

    # Tests use a real PostgreSQL service (no Testcontainers).
    # "trust" auth means no password is needed for this throwaway CI database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eventfund
          POSTGRES_USER: eventfund
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventfund -d eventfund"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eventfund
      SPRING_DATASOURCE_USERNAME: eventfund
      SPRING_DATASOURCE_PASSWORD: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A random JWT secret for this run only, so no secret is stored in the repo.
      - name: Generate test JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml requires some variables to be set; the template's placeholders are enough to build.
      - name: Create .env from template
        run: cp .env.example .env

      - name: Build images
        run: docker compose build
